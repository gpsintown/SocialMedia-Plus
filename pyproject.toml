[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "socialmediaplus"
version = "0.2.0"
description = "Local LinkedIn editorial workspace for Codex and Claude desktop agents"
requires-python = ">=3.11"
dependencies = []
license = {text = "MIT"}

[project.scripts]
smp = "socialmediaplus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
